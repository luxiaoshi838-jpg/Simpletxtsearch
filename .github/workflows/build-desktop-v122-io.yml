name: Build Desktop v1.2.2 IO Optimized

on:
  push:
    branches: [main]
    paths:
      - desktop/tools/optimize_io_v122.py
      - .github/workflows/build-desktop-v122-io.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Apply v1.2.2 IO optimization
        shell: pwsh
        run: |
          python desktop/tools/optimize_io_v122.py
          $source = Get-Content 'desktop/src/main/java/com/luxiaoshi/simpletxtsearch/pc/SimpleTxtSearchPc.java' -Raw
          $pom = Get-Content 'desktop/pom.xml' -Raw
          if ($source -notmatch '简搜 PC 1.2.2') { throw 'UI version missing' }
          if ($source -notmatch '搜索文件内容（较慢，仅文本白名单）') { throw 'Content search switch missing' }
          if ($source -notmatch 'CONTENT_TEXT_EXTENSIONS') { throw 'Text whitelist missing' }
          if ($source -notmatch 'runtime.*,.*output') { throw 'Runtime/output exclusions missing' }
          if ($source -notmatch 'currentPathLabel') { throw 'Current path display missing' }
          if ($source -notmatch 'readLine') { throw 'Line streaming missing' }
          if ($pom -notmatch '<version>1.2.2</version>') { throw 'POM version is not 1.2.2' }
          if ($pom -notmatch 'simpletxtsearch-pc-1.2.2') { throw 'JAR finalName is not 1.2.2' }

      - name: Build fat JAR
        shell: pwsh
        run: |
          mvn -B -f desktop/pom.xml clean package
          if (-not (Test-Path 'desktop/target/simpletxtsearch-pc-1.2.2-all.jar')) {
            Get-ChildItem desktop/target | Format-Table -AutoSize
            throw 'Desktop v1.2.2 fat JAR missing'
          }

      - name: Build portable Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/dist | Out-Null
          jpackage `
            --type app-image `
            --name SimpleSearchPC `
            --input desktop/target `
            --main-jar simpletxtsearch-pc-1.2.2-all.jar `
            --main-class com.luxiaoshi.simpletxtsearch.pc.SimpleTxtSearchPcLauncher `
            --dest desktop/dist `
            --app-version 1.2.2 `
            --vendor luxiaoshi838-jpg `
            --description '简搜 PC 随用版 - IO 优化' `
            --verbose 2>&1 | Tee-Object -FilePath jpackage-v122.log
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed with exit code $LASTEXITCODE" }

          $appDir = Get-ChildItem desktop/dist -Directory | Select-Object -First 1
          if (-not $appDir) { throw 'jpackage app image missing' }
          $exe = Get-ChildItem $appDir.FullName -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable EXE missing' }

          @'
          简搜 PC 随用版 v1.2.2（IO 优化版）

          1. 完整解压后运行 SimpleSearchPC.exe；不需要另装 Java。
          2. 默认模式只搜索文件名，不读取文件内容，因此扫描大目录时磁盘 IO 显著降低。
          3. 多个关键词仍采用 AND 逻辑：同一文件名必须同时包含全部关键词才匹配。
          4. 如勾选“搜索文件内容”，才读取文件正文；内容搜索仅扫描常见纯文本/代码白名单：txt、md、log、csv、tsv、json、xml、java、py、kt、kts、js、ts、html、css、yaml、yml、ini、conf、properties 等。
          5. 内容搜索不扫描 PDF、Word、Excel、APK、JAR、EXE 等二进制/复杂格式，避免 PageIn 和高内存压力。
          6. 默认跳过 runtime、output、build、dist、target、.git、node_modules、缓存、旧版、过往不用等目录。
          7. 内容搜索采用逐行流式匹配；单个内容文件超过 50 MB 时跳过并计数。
          8. 扫描结果分批刷新；界面最多保留前 5000 条结果，但后台继续完整扫描并统计总命中数。
          9. 状态区会持续显示当前正在检查的完整路径，便于定位慢目录。
          10. 本版 Maven/POM、fat JAR、jpackage 应用版本统一为 1.2.2，不再出现 1.2.1 应用配 1.2.0 JAR 的版本混用。
          '@ | Set-Content -Path (Join-Path $appDir.FullName '使用说明.txt') -Encoding UTF8

          $zip = '简搜_PC_随用版_v1.2.2_IO优化版.zip'
          Compress-Archive -Path $appDir.FullName -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-File '简搜_PC_随用版_v1.2.2_IO优化版_SHA256.txt' -Encoding utf8

      - name: Upload portable Windows version
        uses: actions/upload-artifact@v4
        with:
          name: Simpletxtsearch-PC-portable-v1.2.2-io-optimized
          path: |
            简搜_PC_随用版_v1.2.2_IO优化版.zip
            简搜_PC_随用版_v1.2.2_IO优化版_SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simpletxtsearch-PC-v1.2.2-jpackage-log
          path: jpackage-v122.log
          if-no-files-found: warn
          retention-days: 7
