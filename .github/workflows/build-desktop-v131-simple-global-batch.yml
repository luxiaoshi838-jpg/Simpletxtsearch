name: Build Desktop v1.2.11 Simple Global Batch

on:
  push:
    branches: [main]
    paths:
      - desktop/tools/optimize_content_v131_simple_global_batch.py
      - .github/workflows/build-desktop-v131-simple-global-batch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Apply v1.2.11 simple global batching
        shell: pwsh
        run: |
          python desktop/tools/optimize_content_v131_simple_global_batch.py
          $source = Get-Content 'desktop/src/main/java/com/luxiaoshi/simpletxtsearch/pc/SimpleTxtSearchPc.java' -Raw
          if ($source -notmatch 'FIXED_BATCH_SIZE = 200') { throw 'Fixed global 200-file batch missing' }
          if ($source -match 'batchSizeBox') { throw 'Old editable batch-size UI still exists' }
          if ($source -notmatch 'currentBatchCompleted') { throw 'Real current-batch progress counter missing' }
          if ($source -notmatch '当前批.*batchDoneSnapshot.*batchTotalSnapshot') { throw 'Real batch progress display missing' }
          if ($source -notmatch 'Results always accumulate') { throw 'Cumulative result contract missing' }
          if ($source -notmatch 'resultModel.addElement') { throw 'Cumulative result list missing' }
          if ($source -notmatch 'event.getClickCount\(\) == 2') { throw 'Double-click result opening missing' }
          if ($source -notmatch 'ContentSearch.contains') { throw 'Body content search missing' }
          if ($source -match '默认只搜索文件名') { throw 'Filename-only search must not exist' }
          if ($source -notmatch 'SEARCH_THREADS') { throw 'Multithreaded body search missing' }
          if ($source -notmatch 'HEAVY_PARSER_LIMIT') { throw 'Heavy parser concurrency guard missing' }
          if ($source -notmatch 'isProblemFolder') { throw 'Problem-folder skip missing' }
          if ($source -notmatch 'System.gc\(\)') { throw 'Heap-pressure release hook missing' }
          if ($source -notmatch 'MemoryUsageSetting.setupMixed') { throw 'Bounded PDF memory handling missing' }
          if ($source -notmatch 'SequenceInputStream') { throw 'Streaming text search missing' }
          $pom = Get-Content 'desktop/pom.xml' -Raw
          if ($pom -notmatch '<version>1.2.11</version>') { throw 'Maven version is not 1.2.11' }
          if ($pom -notmatch '<finalName>simpletxtsearch-pc-1.2.11</finalName>') { throw 'JAR finalName is not 1.2.11' }

      - name: Build fat JAR
        shell: pwsh
        run: |
          mvn -B -f desktop/pom.xml clean package
          if (-not (Test-Path 'desktop/target/simpletxtsearch-pc-1.2.11-all.jar')) { throw 'Desktop v1.2.11 fat JAR missing' }

      - name: Build portable Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/dist | Out-Null
          jpackage `
            --type app-image `
            --name SimpleSearchPC `
            --input desktop/target `
            --main-jar simpletxtsearch-pc-1.2.11-all.jar `
            --main-class com.luxiaoshi.simpletxtsearch.pc.SimpleTxtSearchPcLauncher `
            --dest desktop/dist `
            --app-version 1.2.11 `
            --vendor luxiaoshi838-jpg `
            --description '简搜 PC 随用版 - 固定200文件分批多线程正文搜索' `
            --verbose 2>&1 | Tee-Object -FilePath jpackage.log
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed with exit code $LASTEXITCODE" }

          $appDir = Get-ChildItem desktop/dist -Directory | Select-Object -First 1
          if (-not $appDir) { throw 'jpackage app image missing' }
          $exe = Get-ChildItem $appDir.FullName -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable EXE missing' }

          @'
          简搜 PC 随用版 v1.2.11

          - 始终搜索文件正文，不做文件名替代搜索。
          - 全局每批固定最多 200 个文件，不再按文件夹定义批次，也没有单批数量设置项。
          - 文件可跨文件夹凑够 200 个后统一进入一批；只有最后一批可能少于 200。
          - 当前批显示真实完成进度，例如 37/200；最后一批例如 37/63。
          - 每批内部多线程正文搜索；PDF/旧 DOC/旧 XLS 等重解析格式限制并发。
          - 每批完成后释放正文解析器、文件流和临时缓冲，再进入下一批。
          - 搜索结果跨全部批次持续累计，不设结果总数上限；只保存轻量文件路径。
          - 双击结果直接打开原文件，也保留打开所选文件/所在文件夹。
          - 问题文件夹自动跳过，不中断后续搜索。
          - 已搜索数量只统计正常完成正文检索的文件；读取失败单独统计。
          '@ | Set-Content -Path (Join-Path $appDir.FullName '使用说明.txt') -Encoding UTF8

          $zip = '简搜_PC_随用版_v1.2.11_固定200分批正文搜索版.zip'
          Compress-Archive -Path $appDir.FullName -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-File '简搜_PC_随用版_v1.2.11_固定200分批正文搜索版_SHA256.txt' -Encoding utf8

      - name: Upload portable Windows version
        uses: actions/upload-artifact@v4
        with:
          name: Simpletxtsearch-PC-portable-v1.2.11-simple-global-batch
          path: |
            简搜_PC_随用版_v1.2.11_固定200分批正文搜索版.zip
            简搜_PC_随用版_v1.2.11_固定200分批正文搜索版_SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simpletxtsearch-PC-v1.2.11-jpackage-log
          path: jpackage.log
          if-no-files-found: warn
          retention-days: 7
