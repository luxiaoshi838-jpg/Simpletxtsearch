name: Build Desktop v1.2.9 Problem Folder Skip

on:
  push:
    branches: [main]
    paths:
      - desktop/tools/optimize_content_v129_problem_folder_skip.py
      - .github/workflows/build-desktop-v129-problem-folder-skip.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Apply v1.2.9 problem-folder skip tolerance
        shell: pwsh
        run: |
          python desktop/tools/optimize_content_v129_problem_folder_skip.py
          $source = Get-Content 'desktop/src/main/java/com/luxiaoshi/simpletxtsearch/pc/SimpleTxtSearchPc.java' -Raw
          if ($source -notmatch '多线程搜索文件正文') { throw 'Content-search UI missing' }
          if ($source -match '默认只搜索文件名') { throw 'Filename-only mode must not exist' }
          if ($source -notmatch 'JComboBox<Integer> batchSizeBox') { throw 'Batch-size setting missing' }
          if ($source -notmatch 'Deque<Path> folderQueue') { throw 'Folder queue missing' }
          if ($source -notmatch 'SEARCH_THREADS') { throw 'Parallel content search missing' }
          if ($source -notmatch 'HEAVY_PARSER_LIMIT') { throw 'Heavy parser guard missing' }
          if ($source -notmatch 'Results are cumulative') { throw 'Cumulative results contract missing' }
          if ($source -match 'MAX_DISPLAY_RESULTS') { throw 'Result-total cap must not exist' }
          if ($source -notmatch 'event.getClickCount\(\) == 2') { throw 'Double-click result open missing' }
          if ($source -notmatch 'isProblemFolder') { throw 'Problem-folder runtime validation missing' }
          if ($source -notmatch 'markProblemFolder') { throw 'Problem-folder skip tracking missing' }
          if ($source -notmatch 'Files.isSymbolicLink') { throw 'Link-loop protection missing' }
          if ($source -notmatch 'LinkOption.NOFOLLOW_LINKS') { throw 'No-follow directory protection missing' }
          if ($source -notmatch 'DirectoryIteratorException') { throw 'Directory iterator fault handling missing' }
          if ($source -notmatch '问题文件夹自动跳过') { throw 'Problem-folder status missing' }
          if ($source -notmatch 'MemoryUsageSetting.setupMixed') { throw 'Bounded PDF memory mode missing' }
          if ($source -notmatch 'SequenceInputStream') { throw 'Single-pass text scan missing' }
          if ($source -notmatch 'PushbackReader') { throw 'Streaming RTF scan missing' }
          if ($source -notmatch 'System.gc\(\)') { throw 'Batch heap-pressure release hook missing' }
          $pom = Get-Content 'desktop/pom.xml' -Raw
          if ($pom -notmatch '<version>1.2.9</version>') { throw 'Maven version is not 1.2.9' }
          if ($pom -notmatch '<finalName>simpletxtsearch-pc-1.2.9</finalName>') { throw 'JAR finalName is not 1.2.9' }

      - name: Build fat JAR
        shell: pwsh
        run: |
          mvn -B -f desktop/pom.xml clean package
          if (-not (Test-Path 'desktop/target/simpletxtsearch-pc-1.2.9-all.jar')) { throw 'Desktop v1.2.9 fat JAR missing' }

      - name: Build portable Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/dist | Out-Null
          jpackage `
            --type app-image `
            --name SimpleSearchPC `
            --input desktop/target `
            --main-jar simpletxtsearch-pc-1.2.9-all.jar `
            --main-class com.luxiaoshi.simpletxtsearch.pc.SimpleTxtSearchPcLauncher `
            --dest desktop/dist `
            --app-version 1.2.9 `
            --vendor luxiaoshi838-jpg `
            --description '简搜 PC 随用版 - 分批多线程正文搜索 + 问题文件夹自动跳过' `
            --verbose 2>&1 | Tee-Object -FilePath jpackage.log
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed with exit code $LASTEXITCODE" }

          $appDir = Get-ChildItem desktop/dist -Directory | Select-Object -First 1
          if (-not $appDir) { throw 'jpackage app image missing' }
          $exe = Get-ChildItem $appDir.FullName -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable EXE missing' }

          @'
          简搜 PC 随用版 v1.2.9

          - 始终搜索文件正文，不改成文件名搜索。
          - 文件夹作为任务队列，不设总任务数量上限。
          - 每个文件夹按“单批任务上限”分批处理；每批内部多线程正文搜索。
          - 搜索结果跨文件夹、跨批次持续累计，不设结果总上限；每条只保存文件路径。
          - 双击结果直接打开原文件；也保留“打开所选文件”和“打开所在文件夹”。
          - 每批结束后释放正文解析器、文件流、临时字符缓冲；仅内存压力高时请求 GC。
          - 无权限、路径失效、目录枚举异常、符号链接/链接类目录等问题文件夹会自动整目录跳过。
          - 一个问题文件夹不会终止整次搜索；状态栏显示自动跳过数量和最近跳过路径。
          - 默认仍排除 runtime/output/build/dist/target/.git/.gradle/node_modules/缓存/旧版/过往不用等目录。
          - 支持 TXT/MD/LOG、PDF、DOC/DOCX/ODT/RTF、XLS/XLSX/ODS/CSV/TSV 正文内容搜索。
          - 多关键词为 AND：同一文件正文必须同时包含全部关键词才命中。
          '@ | Set-Content -Path (Join-Path $appDir.FullName '使用说明.txt') -Encoding UTF8

          $zip = '简搜_PC_随用版_v1.2.9_问题文件夹自动跳过版.zip'
          Compress-Archive -Path $appDir.FullName -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-File '简搜_PC_随用版_v1.2.9_问题文件夹自动跳过版_SHA256.txt' -Encoding utf8

      - name: Upload portable Windows version
        uses: actions/upload-artifact@v4
        with:
          name: Simpletxtsearch-PC-portable-v1.2.9-problem-folder-skip
          path: |
            简搜_PC_随用版_v1.2.9_问题文件夹自动跳过版.zip
            简搜_PC_随用版_v1.2.9_问题文件夹自动跳过版_SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simpletxtsearch-PC-v1.2.9-jpackage-log
          path: jpackage.log
          if-no-files-found: warn
          retention-days: 7
