name: Build Desktop Portable and Signing Tool

on:
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/build-desktop-and-tools.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/build-desktop-and-tools.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Build fat JAR
        shell: pwsh
        run: |
          mvn -B -f desktop/pom.xml clean package
          if (-not (Test-Path 'desktop/target/simpletxtsearch-pc-1.2.0-all.jar')) {
            throw 'Desktop fat JAR missing'
          }

      - name: Build portable Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/dist | Out-Null
          jpackage `
            --type app-image `
            --name SimpleSearchPC `
            --input desktop/target `
            --main-jar simpletxtsearch-pc-1.2.0-all.jar `
            --main-class com.luxiaoshi.simpletxtsearch.pc.SimpleTxtSearchPcLauncher `
            --dest desktop/dist `
            --app-version 1.2.0 `
            --vendor luxiaoshi838-jpg `
            --description '简搜 PC 随用版' `
            --verbose 2>&1 | Tee-Object -FilePath jpackage.log
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed with exit code $LASTEXITCODE" }

          $appDir = Get-ChildItem desktop/dist -Directory | Select-Object -First 1
          if (-not $appDir) { throw 'jpackage app image missing' }
          $exe = Get-ChildItem $appDir.FullName -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable EXE missing' }

          @'
          简搜 PC 随用版 1.2.0

          1. 请先完整解压，再双击目录中的“SimpleSearchPC.exe”。
          2. 不需要另装 Java。
          3. 关键词之间用空格分隔，最多 10 个。
          4. 同一文件必须同时包含全部关键词才会列入结果。
          5. 搜索结果分为“名称”和“文件位置”两列；第二列只显示所在目录。
          6. 双击搜索结果或点击“打开所选文件”即可打开原文件。
          7. 不要单独复制 EXE；请保留同目录的 app 和 runtime 文件夹。
          '@ | Set-Content -Path (Join-Path $appDir.FullName '使用说明.txt') -Encoding UTF8

          Compress-Archive -Path $appDir.FullName -DestinationPath '简搜_PC_随用版_v1.2.0.zip' -CompressionLevel Optimal
          Get-FileHash '简搜_PC_随用版_v1.2.0.zip' -Algorithm SHA256 |
            Format-List | Out-File '简搜_PC_随用版_v1.2.0_SHA256.txt' -Encoding utf8

      - name: Upload portable Windows version
        uses: actions/upload-artifact@v4
        with:
          name: Simpletxtsearch-PC-portable-v1.2.0
          path: |
            简搜_PC_随用版_v1.2.0.zip
            简搜_PC_随用版_v1.2.0_SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload jpackage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simpletxtsearch-PC-jpackage-log
          path: jpackage.log
          if-no-files-found: warn
          retention-days: 7

  signing-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download public APK signing tool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar' \
            --output uber-apk-signer-1.3.0.jar
          test -s uber-apk-signer-1.3.0.jar
          jarsigner -verify -verbose -certs uber-apk-signer-1.3.0.jar > uber-apk-signer-jarsigner-verification.txt
          sha256sum uber-apk-signer-1.3.0.jar > uber-apk-signer-1.3.0.sha256

      - name: Upload signing tool
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: |
            uber-apk-signer-1.3.0.jar
            uber-apk-signer-1.3.0.sha256
            uber-apk-signer-jarsigner-verification.txt
          if-no-files-found: error
          retention-days: 7
